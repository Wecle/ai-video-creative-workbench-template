services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: "@creative/backend"
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: 4001
      DATABASE_URL: postgresql://template:template@postgres:5432/template
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: "@creative/gateway"
    environment:
      HOST: 0.0.0.0
      GATEWAY_PORT: 4000
      BACKEND_URL: http://backend:4001
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-runner:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: "@creative/agent-runner"
    environment:
      HOST: 0.0.0.0
      AGENT_RUNNER_PORT: 4100
    ports:
      - "127.0.0.1:4100:4100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  media-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: "@creative/web"
        GATEWAY_URL: http://gateway:4000
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
