name: creative-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # One-shot, idempotent: create the temporal databases, tables and upgrade the schema.
  temporal-setup:
    image: temporalio/admin-tools:1.31.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: template
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for db in temporal temporal_visibility; do
          kind=$$([ "$$db" = temporal ] && echo temporal || echo visibility)
          t="temporal-sql-tool --plugin postgres12 --ep postgres -u template -p 5432 --db $$db"
          $$t create
          $$t setup-schema -v 0.0
          $$t update-schema -d /etc/temporal/schema/postgresql/v12/$$kind/versioned
        done

  temporal:
    image: temporalio/server:1.31.3
    depends_on:
      temporal-setup:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: template
      POSTGRES_PWD: template
      # Fixed at cluster creation; later changes are ignored. See infra/README.md.
      NUM_HISTORY_SHARDS: 4
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30

  # One-shot: the server image does not create the default namespace.
  temporal-namespace:
    image: temporalio/admin-tools:1.31.3
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - temporal operator namespace describe -n default --address temporal:7233 >/dev/null 2>&1 || temporal operator namespace create -n default --address temporal:7233

  temporal-ui:
    image: temporalio/ui:2.55.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
