[project]
name = "creative-media-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.13.5,<3",
    "temporalio>=1.34.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "httpx>=0.28.1,<1",
    "ruff>=0.16.10,<1",
    "jsonschema>=4.26.0,<5",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
