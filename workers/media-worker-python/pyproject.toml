[project]
name = "creative-media-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116.0,<1", "uvicorn[standard]>=0.35.0,<1", "pydantic>=2.11.0,<3"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
