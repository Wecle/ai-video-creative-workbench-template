version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /workers/media-worker-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      pip-dependencies:
        patterns:
          - "*"
